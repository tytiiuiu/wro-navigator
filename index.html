<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyBro — Control & Telemetry</title>
  <style>
    :root {
      --bg-color: #0f0c1b;
      --card-bg: #1a162b;
      --accent: #7b2cbf;
      --accent-glow: #9d4edd;
      --text: #ffffff;
      --text-dim: #a0a0b0;
      --success: #00f5d4;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 5px;
      color: var(--accent-glow);
      letter-spacing: 2px;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      max-width: 1000px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    #mapContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      background: #080610;
      border-radius: 12px;
      border: 2px solid var(--accent);
      width: 100%;
      max-width: 600px;
      height: 400px;
    }

    .stat-group {
      margin-bottom: 20px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--success);
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #080610;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-glow));
      width: 0%;
      transition: width 0.3s ease;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent-glow);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    button.secondary {
      background: transparent;
      border: 1px solid var(--text-dim);
      color: var(--text-dim);
    }

    button.secondary:hover {
      border-color: var(--text);
      color: var(--text);
      box-shadow: none;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      background: rgba(123, 44, 191, 0.2);
      color: var(--accent-glow);
      border: 1px solid var(--accent);
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <h1>HYBRO CORE</h1>
  <div class="subtitle">Система автономной уборки поверхностей</div>

  <div class="dashboard">
    <div class="card" id="mapContainer">
      <canvas id="cleanMap" width="600" height="400"></canvas>
    </div>

    <div class="card">
      <div class="status-badge" id="botStatus">Статус: Готов к запуску</div>

      <div class="stat-group">
        <div class="stat-label">Прогресс сканирования / уборки</div>
        <div class="stat-value" id="progressVal">0%</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="stat-group">
        <div class="stat-label">Режим работы</div>
        <div class="stat-value" style="color: #fff;" id="modeVal">Ожидание</div>
      </div>

      <div class="stat-group">
        <div class="stat-label">Заряд батареи</div>
        <div class="stat-value" style="color: #00f5d4;">95%</div>
      </div>

      <div class="btn-group">
        <button onclick="startMission()">СТАРТ</button>
        <button class="secondary" onclick="resetMap()">Сброс карты</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('cleanMap');
    const ctx = canvas.getContext('2d');
    
    let robot = { x: 50, y: 50, angle: 0, size: 16 };
    let boundary = { x: 50, y: 50, width: 500, height: 300 };
    let path = [];
    let state = 'IDLE';
    let isMapScanned = false;
    let scanStep = 0;
    let progress = 0;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.lineWidth = 1;
      ctx.strokeRect(boundary.x, boundary.y, boundary.width, boundary.height);

      if (isMapScanned || state === 'SCANNING') {
        ctx.strokeStyle = '#00f5d4';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(boundary.x, boundary.y, boundary.width, boundary.height);
        ctx.setLineDash([]);
      }

      if (path.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = '#9d4edd';
        ctx.lineWidth = 12;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo(path[i].x, path[i].y);
        }
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(robot.x, robot.y);
      ctx.rotate(robot.angle);

      ctx.fillStyle = '#7b2cbf';
      ctx.beginPath();
      ctx.arc(0, 0, robot.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#00f5d4';
      ctx.beginPath();
      ctx.arc(robot.size / 2, 0, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function updateLogic() {
      if (state === 'SCANNING') {
        document.getElementById('botStatus').innerText = 'Статус: Сканирование периметра...';
        document.getElementById('modeVal').innerText = 'Калибровка границ';

        if (scanStep === 0) {
          robot.x += 4;
          if (robot.x >= boundary.x + boundary.width) scanStep = 1;
        } else if (scanStep === 1) {
          robot.y += 4;
          if (robot.y >= boundary.y + boundary.height) scanStep = 2;
        } else if (scanStep === 2) {
          robot.x -= 4;
          if (robot.x <= boundary.x) scanStep = 3;
        } else if (scanStep === 3) {
          robot.y -= 4;
          if (robot.y <= boundary.y) {
            isMapScanned = true;
            state = 'CLEANING';
            scanStep = 0;
            path = [];
          }
        }
      } else if (state === 'CLEANING') {
        document.getElementById('botStatus').innerText = 'Статус: Выполнение уборки';
        document.getElementById('modeVal').innerText = 'Уборка (Змейка)';

        path.push({ x: robot.x, y: robot.y });
        
        if (scanStep % 2 === 0) {
          robot.x += 3;
          if (robot.x >= boundary.x + boundary.width) {
            robot.y += 20;
            scanStep++;
          }
        } else {
          robot.x -= 3;
          if (robot.x <= boundary.x) {
            robot.y += 20;
            scanStep++;
          }
        }

        progress = Math.min(100, Math.round(((robot.y - boundary.y) / boundary.height) * 100));
        document.getElementById('progressVal').innerText = progress + '%';
        document.getElementById('progressFill').style.width = progress + '%';

        if (robot.y >= boundary.y + boundary.height) {
          state = 'IDLE';
          document.getElementById('botStatus').innerText = 'Статус: Уборка завершена!';
        }
      }

      draw();
      if (state !== 'IDLE') {
        requestAnimationFrame(updateLogic);
      }
    }

    function startMission() {
      if (state === 'IDLE') {
        robot.x = boundary.x;
        robot.y = boundary.y;

        if (!isMapScanned) {
          state = 'SCANNING';
          scanStep = 0;
        } else {
          path = [];
          state = 'CLEANING';
          scanStep = 0;
        }
        updateLogic();
      }
    }

    function resetMap() {
      state = 'IDLE';
      isMapScanned = false;
      robot.x = boundary.x;
      robot.y = boundary.y;
      path = [];
      progress = 0;
      document.getElementById('progressVal').innerText = '0%';
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('botStatus').innerText = 'Статус: Карта сброшена';
      document.getElementById('modeVal').innerText = 'Ожидание';
      draw();
    }

    draw();
  </script>
</body>
</html>
